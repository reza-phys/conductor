<style>
:root {
  color-scheme: light;
  --cd-bg: #ffffff;
  --cd-fg: #1a1f26;
  --cd-muted: #59626f;
  --cd-line: #e2e5ea;
  --cd-soft: #f4f6f8;
  --cd-card: #ffffff;
  --cd-link: #1d4ed8;
  --cd-focus: #2563eb;
  --cd-live: #15803d;
  --cd-warn: #9a3412;
  --cd-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --cd-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  --cd-running-bg: #dbeafe;   --cd-running-fg: #1e40af;
  --cd-blocked-bg: #ffedd5;   --cd-blocked-fg: #9a3412;
  --cd-queued-bg: #ede9fe;    --cd-queued-fg: #5b21b6;
  --cd-pending-bg: #eef1f5;   --cd-pending-fg: #475569;
  --cd-open-bg: #fef3c7;      --cd-open-fg: #854d0e;
  --cd-failed-bg: #fee2e2;    --cd-failed-fg: #991b1b;
  --cd-done-bg: #dcfce7;      --cd-done-fg: #166534;
  --cd-decided-bg: #ccfbf1;   --cd-decided-fg: #115e59;
  --cd-todo-bg: #f1f5f9;      --cd-todo-fg: #334155;
  --cd-unverified-bg: #fae8ff; --cd-unverified-fg: #86198f;
  --cd-neutral-bg: #e5e7eb;   --cd-neutral-fg: #374151;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --cd-bg: #0f1216;
    --cd-fg: #e6e9ee;
    --cd-muted: #9ca5b3;
    --cd-line: #272d36;
    --cd-soft: #161a21;
    --cd-card: #141820;
    --cd-link: #93b4ff;
    --cd-focus: #7aa7ff;
    --cd-live: #4ade80;
    --cd-warn: #fdba74;
    --cd-running-bg: #1b3358;   --cd-running-fg: #c7dbff;
    --cd-blocked-bg: #4a2511;   --cd-blocked-fg: #fed7aa;
    --cd-queued-bg: #2e2360;    --cd-queued-fg: #ddd6fe;
    --cd-pending-bg: #232a35;   --cd-pending-fg: #cbd5e1;
    --cd-open-bg: #42300a;      --cd-open-fg: #fde68a;
    --cd-failed-bg: #4c1717;    --cd-failed-fg: #fecaca;
    --cd-done-bg: #133d25;      --cd-done-fg: #bbf7d0;
    --cd-decided-bg: #0f3b38;   --cd-decided-fg: #99f6e4;
    --cd-todo-bg: #1e2530;      --cd-todo-fg: #e2e8f0;
    --cd-unverified-bg: #3f1646; --cd-unverified-fg: #f5d0fe;
    --cd-neutral-bg: #272d37;   --cd-neutral-fg: #d6dae1;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --cd-bg: #0f1216;
  --cd-fg: #e6e9ee;
  --cd-muted: #9ca5b3;
  --cd-line: #272d36;
  --cd-soft: #161a21;
  --cd-card: #141820;
  --cd-link: #93b4ff;
  --cd-focus: #7aa7ff;
  --cd-live: #4ade80;
  --cd-warn: #fdba74;
  --cd-running-bg: #1b3358;   --cd-running-fg: #c7dbff;
  --cd-blocked-bg: #4a2511;   --cd-blocked-fg: #fed7aa;
  --cd-queued-bg: #2e2360;    --cd-queued-fg: #ddd6fe;
  --cd-pending-bg: #232a35;   --cd-pending-fg: #cbd5e1;
  --cd-open-bg: #42300a;      --cd-open-fg: #fde68a;
  --cd-failed-bg: #4c1717;    --cd-failed-fg: #fecaca;
  --cd-done-bg: #133d25;      --cd-done-fg: #bbf7d0;
  --cd-decided-bg: #0f3b38;   --cd-decided-fg: #99f6e4;
  --cd-todo-bg: #1e2530;      --cd-todo-fg: #e2e8f0;
  --cd-unverified-bg: #3f1646; --cd-unverified-fg: #f5d0fe;
  --cd-neutral-bg: #272d37;   --cd-neutral-fg: #d6dae1;
}

/* state tokens: applied via data-st (chips, dots, phase segments) */
[data-st] { --st-bg: var(--cd-neutral-bg); --st-fg: var(--cd-neutral-fg); }
[data-st="running"], [data-st="active"] { --st-bg: var(--cd-running-bg); --st-fg: var(--cd-running-fg); }
[data-st="blocked"] { --st-bg: var(--cd-blocked-bg); --st-fg: var(--cd-blocked-fg); }
[data-st="queued"] { --st-bg: var(--cd-queued-bg); --st-fg: var(--cd-queued-fg); }
[data-st="pending"] { --st-bg: var(--cd-pending-bg); --st-fg: var(--cd-pending-fg); }
[data-st="open"] { --st-bg: var(--cd-open-bg); --st-fg: var(--cd-open-fg); }
[data-st="failed"], [data-st="refuted"] { --st-bg: var(--cd-failed-bg); --st-fg: var(--cd-failed-fg); }
[data-st="done"], [data-st="verified"] { --st-bg: var(--cd-done-bg); --st-fg: var(--cd-done-fg); }
[data-st="decided"] { --st-bg: var(--cd-decided-bg); --st-fg: var(--cd-decided-fg); }
[data-st="todo"] { --st-bg: var(--cd-todo-bg); --st-fg: var(--cd-todo-fg); }
[data-st="unverified"] { --st-bg: var(--cd-unverified-bg); --st-fg: var(--cd-unverified-fg); }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; overflow-anchor: none; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0;
  background: var(--cd-bg);
  color: var(--cd-fg);
  font: 15px/1.5 var(--cd-sans);
  overflow-wrap: anywhere;
}
a { color: var(--cd-link); }
:focus-visible { outline: 2px solid var(--cd-focus); outline-offset: 2px; border-radius: 3px; }
code, .cd-mono { font-family: var(--cd-mono); font-size: 0.9em; }
h1, h2, h3 { line-height: 1.25; margin: 0; }
h2 { font-size: 1.15rem; }
h3 { font-size: 0.95rem; margin: 0 0 8px; }
ul, ol { margin: 0; padding: 0; list-style: none; }

.cd-shell {
  max-width: 1320px;
  margin: 0 auto;
  padding: 0 16px;
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr);
  grid-template-areas: "nav head" "nav body" "nav foot";
  grid-template-rows: auto 1fr auto;
  column-gap: 32px;
}
.cd-head { grid-area: head; padding: 24px 0 8px; min-width: 0; }
.cd-body { grid-area: body; min-width: 0; }
.cd-foot { grid-area: foot; min-width: 0; }

/* sidebar: overview, sessions, tasks */
.cd-nav { grid-area: nav; min-width: 0; }
.cd-nav-inner {
  position: sticky; top: 0; max-height: 100vh; overflow-y: auto; overscroll-behavior: contain;
  padding: 22px 6px 24px 0; border-right: 1px solid var(--cd-line);
}
.cd-drawer-btn { display: none; }
.cd-nav-title { display: flex; align-items: baseline; gap: 8px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--cd-muted); margin: 18px 0 6px 8px; }
.cd-nav a { color: var(--cd-fg); text-decoration: none; }
.cd-nav a:hover { background: var(--cd-soft); }
.cd-nav a[aria-current="page"] { background: var(--cd-soft); box-shadow: inset 3px 0 0 var(--cd-focus); font-weight: 600; }
.cd-nav-ov { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 0.95rem; }
.cd-nav-jumps { margin: 2px 0 0 12px; padding-left: 8px; border-left: 1px solid var(--cd-line); }
.cd-nav-jumps a { display: flex; justify-content: space-between; gap: 8px; padding: 2px 8px; border-radius: 6px; font-size: 0.85rem; color: var(--cd-muted); }
.cd-nav-jumps a:hover { color: var(--cd-fg); }
.cd-sess { margin-bottom: 4px; }
.cd-sess-row { display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: start; }
.cd-tog {
  font: inherit; background: none; border: 0; padding: 0; margin-top: 6px; width: 22px; height: 22px; border-radius: 4px;
  color: var(--cd-muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
}
.cd-tog:hover { background: var(--cd-soft); color: var(--cd-fg); }
.cd-tog .cd-caret { height: auto; line-height: 1; }
.cd-tog[aria-expanded="true"] .cd-caret { transform: rotate(90deg); }
.cd-sess-link { display: flex; flex-direction: column; gap: 1px; padding: 5px 8px; border-radius: 6px; min-width: 0; }
.cd-sess-time { font-size: 0.78rem; color: var(--cd-muted); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 0 6px; align-items: center; }
.cd-nav-live { display: inline-flex; align-items: center; gap: 4px; color: var(--cd-live); font-weight: 600; }
.cd-nav-live .cd-live-dot { background: var(--cd-live); width: 7px; height: 7px; }
.cd-sess-title { font-size: 0.9rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cd-sess-counts { font-size: 0.78rem; color: var(--cd-muted); display: flex; flex-wrap: wrap; gap: 0 8px; align-items: center; }
.cd-nav-tasks { margin: 1px 0 6px 22px; padding-left: 6px; border-left: 1px solid var(--cd-line); }
.cd-nav-tasks a { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: baseline; gap: 2px 7px; padding: 4px 6px; border-radius: 6px; font-size: 0.85rem; }
.cd-nav-key { font-family: var(--cd-mono); font-size: 0.78rem; color: var(--cd-muted); white-space: nowrap; }
.cd-nav-ttl { line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cd-nav-other .cd-nav-ttl { color: var(--cd-muted); font-style: italic; }

/* breadcrumbs */
.cd-crumbs { display: flex; flex-wrap: wrap; gap: 2px 6px; font-size: 0.85rem; color: var(--cd-muted); margin-top: 10px; }
.cd-crumbs a { color: var(--cd-link); }
.cd-crumbs [aria-current] { color: var(--cd-fg); }
.cd-badge {
  display: inline-block; min-width: 1.4em; padding: 0 6px; border-radius: 999px;
  background: var(--cd-open-bg); color: var(--cd-open-fg); font-size: 0.75rem; font-weight: 600; text-align: center;
  font-variant-numeric: tabular-nums;
}

/* header */
.cd-topline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 0.85rem; color: var(--cd-muted); }
.cd-brand { display: inline-flex; align-items: center; gap: 7px; color: var(--cd-fg); font-weight: 650; text-decoration: none; }
.cd-brand:hover span { text-decoration: underline; }
.cd-live { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.cd-live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cd-muted); flex: none; }
.cd-live[data-mode="live"] { color: var(--cd-live); }
.cd-live[data-mode="live"] .cd-live-dot { background: var(--cd-live); }
.cd-live[data-mode="lost"] { color: var(--cd-warn); font-weight: 500; }
.cd-live[data-mode="lost"] .cd-live-dot { background: var(--cd-warn); }
@media (prefers-reduced-motion: no-preference) {
  .cd-live[data-mode="live"] .cd-live-dot { animation: cd-pulse 2s ease-in-out infinite; }
}
@keyframes cd-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.8); } }
.cd-spacer { flex: 1; }
.cd-btn {
  font: inherit; font-size: 0.85rem; color: var(--cd-fg); background: var(--cd-card);
  border: 1px solid var(--cd-line); border-radius: 6px; padding: 3px 10px; cursor: pointer;
}
.cd-btn:hover { background: var(--cd-soft); }
.cd-head h1 { font-size: 1.6rem; margin: 10px 0 2px; }
.cd-sub { margin: 0; color: var(--cd-muted); }
.cd-task {
  margin: 14px 0 0; padding: 10px 14px; border-left: 3px solid var(--cd-line);
  background: var(--cd-soft); border-radius: 0 6px 6px 0;
}
.cd-task-label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--cd-muted); margin-bottom: 2px; }
.cd-task-text { white-space: pre-wrap; margin: 0; }
.cd-search { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 14px; }
.cd-search input {
  flex: 1 1 240px; min-width: 0; font: inherit; color: var(--cd-fg); background: var(--cd-card);
  border: 1px solid var(--cd-line); border-radius: 8px; padding: 7px 11px;
}
.cd-search input::placeholder { color: var(--cd-muted); opacity: 1; }
.cd-count { font-size: 0.85rem; color: var(--cd-muted); font-variant-numeric: tabular-nums; }
.cd-vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* sections */
.cd-sec { padding: 22px 0 6px; border-top: 1px solid var(--cd-line); margin-top: 18px; scroll-margin-top: 8px; }
.cd-sec-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 12px; }
.cd-sub-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 8px; }
.cd-sub-head h3 { margin: 0; }
.cd-muted { color: var(--cd-muted); }
.cd-small { font-size: 0.85rem; }
.cd-empty { color: var(--cd-muted); margin: 4px 0; font-size: 0.92rem; }
.cd-nomatch { color: var(--cd-muted); font-style: italic; margin: 6px 0; font-size: 0.9rem; }
.cd-block + .cd-block { margin-top: 22px; }

/* chips */
.cd-chip {
  display: inline-block; flex: none; padding: 1px 8px; border-radius: 999px;
  background: var(--st-bg); color: var(--st-fg);
  font-size: 0.75rem; font-weight: 600; line-height: 1.5; white-space: nowrap; letter-spacing: 0.01em;
}
.cd-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--st-fg); flex: none; }
.cd-kind {
  display: inline-block; padding: 0 6px; border: 1px solid var(--cd-line); border-radius: 4px;
  font-size: 0.75rem; color: var(--cd-muted); white-space: nowrap; font-family: var(--cd-mono);
}

/* filter chips */
.cd-filters { display: flex; flex-wrap: wrap; gap: 6px; }
.cd-fbtn {
  display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: 0.8rem; color: var(--cd-muted); background: transparent;
  border: 1px solid var(--cd-line); border-radius: 999px; padding: 2px 10px; cursor: pointer;
}
.cd-fbtn:hover { color: var(--cd-fg); background: var(--cd-soft); }
.cd-fbtn[aria-pressed="true"] { color: var(--cd-bg); background: var(--cd-fg); border-color: var(--cd-fg); }
.cd-fcount { font-variant-numeric: tabular-nums; opacity: 0.85; }

/* current state */
.cd-intent { margin: 0 0 12px; max-width: 75ch; }
.cd-kill { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 0 0 16px; font-size: 0.92rem; }
.cd-kill-text { flex: 1 1 240px; min-width: 0; }
.cd-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--cd-muted); }
.cd-phases { margin: 4px 0 18px; }
.cd-phasebar { display: flex; gap: 4px; }
.cd-seg {
  flex: 1 1 0; min-width: 28px; display: flex; flex-direction: column; align-items: stretch; gap: 4px;
  padding: 0; border: 0; background: none; cursor: pointer; font: inherit; color: var(--cd-muted);
}
.cd-seg-bar { height: 10px; border-radius: 5px; background: var(--st-bg); box-shadow: inset 0 0 0 1.5px var(--st-fg); }
.cd-seg[data-st="done"] .cd-seg-bar, .cd-seg[data-st="running"] .cd-seg-bar,
.cd-seg[data-st="failed"] .cd-seg-bar, .cd-seg[data-st="blocked"] .cd-seg-bar { background: var(--st-fg); }
.cd-seg-label { font-size: 0.75rem; text-align: left; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cd-seg[aria-pressed="true"] .cd-seg-label { color: var(--cd-fg); font-weight: 600; }
.cd-phase-detail { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-top: 8px; font-size: 0.92rem; min-height: 1.5em; }
.cd-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px 28px; margin-bottom: 18px; }
.cd-mini li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 6px 0; border-bottom: 1px solid var(--cd-line); font-size: 0.92rem; }
.cd-mini li:last-child { border-bottom: 0; }
.cd-now { flex-basis: 100%; color: var(--cd-muted); font-size: 0.85rem; font-family: var(--cd-mono); }
.cd-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 12px; }
.cd-card {
  display: block; padding: 12px 14px; border: 1px solid var(--cd-line); border-radius: 10px;
  background: var(--cd-card); color: inherit; text-decoration: none;
}
a.cd-card:hover { border-color: var(--cd-muted); }
.cd-card-label { font-size: 0.8rem; color: var(--cd-muted); }
.cd-card-value { font-size: 1.6rem; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; margin: 2px 0; }
.cd-card-note { font-size: 0.82rem; color: var(--cd-muted); }
.cd-card[data-attn="1"] { border-color: var(--cd-open-fg); }

/* tables */
.cd-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.cd-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
.cd-table th {
  text-align: left; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--cd-muted); padding: 6px 10px; border-bottom: 1px solid var(--cd-line); white-space: nowrap;
}
.cd-table td { padding: 7px 10px; border-bottom: 1px solid var(--cd-line); vertical-align: top; }
.cd-table th:first-child, .cd-table td:first-child { padding-left: 0; }
.cd-table td.cd-nw { white-space: nowrap; }
.cd-note { display: block; color: var(--cd-muted); font-size: 0.85rem; }
.cd-grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 24px 32px; }

/* agent tree */
.cd-tree { border-top: 1px solid var(--cd-line); }
.cd-agent { border-bottom: 1px solid var(--cd-line); }
.cd-agent > summary {
  list-style: none; cursor: pointer; padding: 8px 8px 8px calc(4px + var(--cd-depth, 0) * 22px);
  display: grid; grid-template-columns: 14px minmax(0, 1fr); column-gap: 6px;
}
.cd-agent > summary::-webkit-details-marker { display: none; }
.cd-agent > summary:hover { background: var(--cd-soft); }
.cd-caret { align-self: start; display: inline-block; width: 14px; height: 1.6rem; text-align: center; color: var(--cd-muted); font-size: 0.7rem; line-height: 1.6rem; transform-origin: 50% 50%; transition: transform 0.15s; }
.cd-agent[open] > summary .cd-caret { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .cd-caret { transition: none; } }
.cd-l1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.cd-branch { color: var(--cd-muted); font-family: var(--cd-mono); }
.cd-type { font-weight: 600; }
.cd-id { font-family: var(--cd-mono); font-size: 0.85rem; color: var(--cd-muted); }
a.cd-id { color: var(--cd-link); }
#cd-h1:focus:not(:focus-visible) { outline: none; }
.cd-desc { flex: 1 1 200px; min-width: 0; }
.cd-dur { font-variant-numeric: tabular-nums; color: var(--cd-muted); font-size: 0.85rem; white-space: nowrap; }
.cd-l2 { grid-column: 2; display: flex; flex-wrap: wrap; gap: 0 14px; font-size: 0.84rem; color: var(--cd-muted); margin-top: 2px; }
.cd-l2 .cd-act { font-family: var(--cd-mono); font-size: 0.8rem; }
.cd-gate[data-g="blocked"], .cd-gate[data-g="escalated"] { color: var(--cd-warn); font-weight: 600; }
.cd-agent-body { padding: 4px 12px 14px calc(30px + var(--cd-depth, 0) * 22px); font-size: 0.9rem; }
.cd-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; }
.cd-kv dt { color: var(--cd-muted); font-size: 0.82rem; padding-top: 1px; }
.cd-kv dd { margin: 0; }
.cd-files li, .cd-reasons li { font-size: 0.85rem; }
.cd-files li { font-family: var(--cd-mono); }
.cd-reasons li::before { content: "– "; color: var(--cd-muted); }

/* HITL */
.cd-hlist { display: grid; gap: 10px; }
.cd-hitem { padding: 12px 14px; border: 1px solid var(--cd-line); border-radius: 10px; background: var(--cd-card); min-width: 0; }
.cd-hitem[data-cd-state="open"] { border-left: 3px solid var(--cd-open-fg); }
.cd-hitem-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.cd-hitem-head .cd-id { color: var(--cd-fg); }
.cd-hitem-title { flex: 1 1 220px; min-width: 0; font-weight: 600; }
.cd-problem { margin: 6px 0 0; max-width: 75ch; }
.cd-ctx { display: flex; flex-wrap: wrap; gap: 0 6px; margin-top: 4px; font-size: 0.82rem; color: var(--cd-muted); }
.cd-ctx > * + *::before { content: "·"; display: inline-block; margin-right: 6px; color: var(--cd-muted); text-decoration: none; }
.cd-cats { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.cd-cat {
  display: inline-flex; align-items: baseline; gap: 5px; padding: 0 7px; border: 1px solid var(--cd-line); border-radius: 999px;
  font-size: 0.75rem; color: var(--cd-muted); background: var(--cd-soft); white-space: nowrap;
}
.cd-cat strong { color: var(--cd-fg); font-variant-numeric: tabular-nums; }
.cd-opts { margin-top: 8px; display: grid; gap: 6px; }
.cd-opt {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px;
  padding: 7px 10px; border: 1px solid var(--cd-line); border-radius: 8px; background: var(--cd-card);
}
.cd-opt[data-rec] { border-color: var(--cd-done-fg); }
.cd-opt-text { flex: 1 1 220px; min-width: 0; }
.cd-opt-label { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-weight: 600; }
.cd-opt-desc { display: block; color: var(--cd-muted); font-size: 0.85rem; }
.cd-copy { flex: none; min-width: 5.5em; }
.cd-why { margin: 6px 0 0; font-size: 0.85rem; color: var(--cd-muted); max-width: 75ch; }
.cd-hdet { margin-top: 8px; }
.cd-hdet > summary { cursor: pointer; color: var(--cd-link); font-size: 0.85rem; padding: 2px 0; }
.cd-hdet .cd-prompt-text { max-height: 16rem; overflow: auto; }
.cd-hdec { padding: 0; }
.cd-hdec > summary {
  list-style: none; cursor: pointer; padding: 8px 12px; border-radius: 10px;
  display: grid; grid-template-columns: 14px minmax(0, 1fr); column-gap: 6px;
}
.cd-hdec > summary::-webkit-details-marker { display: none; }
.cd-hdec > summary:hover { background: var(--cd-soft); }
.cd-hdec[open] > summary .cd-caret { transform: rotate(90deg); }
.cd-hdec .cd-caret { height: 1.5rem; line-height: 1.5rem; }
.cd-hrec { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.cd-hrec-text { flex: 1 1 220px; min-width: 0; }
.cd-hrec time { font-family: var(--cd-mono); font-size: 0.8rem; color: var(--cd-muted); white-space: nowrap; }
.cd-hdec-body { padding: 0 14px 12px 32px; }
.cd-hdec-body .cd-hitem-head { margin-top: 2px; }

/* log */
.cd-log li {
  display: grid; grid-template-columns: 4.6em 6.5em minmax(0, 1fr); gap: 2px 10px;
  padding: 5px 0; border-bottom: 1px solid var(--cd-line); font-size: 0.9rem; align-items: baseline;
}
.cd-log time { font-family: var(--cd-mono); font-size: 0.8rem; color: var(--cd-muted); font-variant-numeric: tabular-nums; }
.cd-log .cd-who { color: var(--cd-muted); font-family: var(--cd-mono); font-size: 0.8rem; margin-right: 6px; }
.cd-more > summary { cursor: pointer; color: var(--cd-link); font-size: 0.9rem; padding: 8px 0; }

/* results */
.cd-results { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px; margin-bottom: 10px; }
.cd-findings li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 7px 0; border-bottom: 1px solid var(--cd-line); }
.cd-findings .cd-f-text { flex: 1 1 260px; min-width: 0; }

/* session + task views */
.cd-quote {
  margin: 12px 0 0; padding: 8px 12px; border-left: 3px solid var(--cd-line);
  background: var(--cd-soft); border-radius: 0 6px 6px 0; font-size: 0.92rem;
}
.cd-quote p { margin: 2px 0 0; white-space: pre-wrap; }
.cd-prompt { margin-top: 12px; }
.cd-prompt > summary { cursor: pointer; color: var(--cd-link); font-size: 0.9rem; padding: 4px 0; }
.cd-prompt-text {
  margin: 6px 0 0; padding: 10px 12px; border: 1px solid var(--cd-line); border-radius: 8px; background: var(--cd-soft);
  font-family: var(--cd-mono); font-size: 0.82rem; white-space: pre-wrap; overflow-wrap: anywhere;
}
.cd-gates li { padding: 8px 0; border-bottom: 1px solid var(--cd-line); font-size: 0.92rem; }
.cd-gates li:last-child { border-bottom: 0; }
.cd-gate-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.cd-gate-head time { font-family: var(--cd-mono); font-size: 0.8rem; color: var(--cd-muted); }
.cd-outs li { display: flex; flex-wrap: wrap; gap: 2px 10px; padding: 4px 0; font-size: 0.88rem; }
.cd-path { font-family: var(--cd-mono); font-size: 0.85rem; }
.cd-hist li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 7px 0; border-bottom: 1px solid var(--cd-line); font-size: 0.92rem; }
.cd-hist li:last-child { border-bottom: 0; }
.cd-hist .cd-grow { flex: 1 1 200px; min-width: 0; }

.cd-foot { padding: 28px 0 40px; margin-top: 24px; border-top: 1px solid var(--cd-line); color: var(--cd-muted); font-size: 0.85rem; }
.cd-nodata { padding: 40px 0; color: var(--cd-muted); }

@media (max-width: 860px) {
  .cd-shell { grid-template-columns: minmax(0, 1fr); grid-template-areas: "nav" "head" "body" "foot"; grid-template-rows: none; }
  .cd-head { padding-top: 8px; }
  .cd-nav-inner { position: static; max-height: none; overflow: visible; padding: 12px 0 0; border-right: 0; }
  .cd-drawer-btn {
    display: flex; width: 100%; align-items: center; gap: 8px; text-align: left;
    font: inherit; font-size: 0.9rem; color: var(--cd-fg); background: var(--cd-soft);
    border: 1px solid var(--cd-line); border-radius: 8px; padding: 7px 10px; cursor: pointer;
  }
  .cd-drawer-btn .cd-caret { height: auto; line-height: 1; }
  .cd-drawer-btn[aria-expanded="true"] .cd-caret { transform: rotate(90deg); }
  .cd-drawer-cur { color: var(--cd-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .cd-nav:not([data-open]) .cd-nav-body { display: none; }
  .cd-nav-body { padding: 8px 0 10px; border-bottom: 1px solid var(--cd-line); }
}
@media (max-width: 520px) {
  body { font-size: 14.5px; }
  .cd-head h1 { font-size: 1.35rem; }
  .cd-agent > summary { padding-left: calc(2px + var(--cd-depth, 0) * 12px); }
  .cd-agent-body { padding-left: calc(22px + var(--cd-depth, 0) * 12px); padding-right: 4px; }
  .cd-log li { grid-template-columns: 4.6em minmax(0, 1fr); }
  .cd-log li > span:last-child { grid-column: 1 / -1; }
  .cd-kv { grid-template-columns: minmax(0, 1fr); }
  .cd-kv dd { margin-bottom: 6px; }
  .cd-hitem { padding: 10px 11px; }
  .cd-hdec > summary { padding: 8px 6px; }
  .cd-hdec-body { padding: 0 8px 10px 26px; }
}
</style>

<script>
(function () {
  'use strict';

  var KNOWN = ['running', 'blocked', 'queued', 'pending', 'open', 'failed', 'done', 'decided', 'todo', 'unverified', 'verified', 'refuted', 'active'];
  var IS_HTTP = /^http/.test(location.protocol);
  var IS_FILE = location.protocol === 'file:';
  var POLL_MS = 2000;

  var S = window.__STATUS__;
  var ui = {
    q: '',
    filters: lsGet('cd:filters') || {},
    open: {},            // details keys the viewer opened
    phaseSel: null,      // phase index pinned by tap/click
    conn: 'ok',
    renderedAt: Date.now(),
    route: null,         // parsed location.hash
    nav: {},             // sidebar session short -> expanded (only when the viewer toggled it)
    drawer: false,       // phone drawer open
    qBy: {},             // search text per route, so back/forward restores it
    scrollBy: {},        // scroll position per route
    secIds: null         // overview section ids (sidebar jump list)
  };
  if (typeof ui.filters !== 'object' || Array.isArray(ui.filters)) ui.filters = {};
  try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };

  // Artifact mode (claude.ai): the page may run under a CSP that blocks fetches, so never poll.
  function isArtifact() { return !!(S && S.mode === 'artifact'); }
  function canPoll() { return IS_HTTP && !isArtifact(); }
  // Output/file paths become links only when the page is a local file next to .conductor/ (serve exposes nothing else).
  function canLinkFiles() { return IS_FILE && !isArtifact(); }

  // ---------- routing ----------
  // #/                       project overview
  // #/s/<short>              session
  // #/s/<short>/t/<P2~T3>    task (task key with "/" written as "~")
  // #/s/<short>/other        work in the session that belongs to no task
  // any other hash (#hitl…)  overview, scrolled to that section
  function dec(x) { try { return decodeURIComponent(x); } catch (e) { return x; } }
  function parseRoute() {
    var hs = location.hash || '';
    if (!/^#\//.test(hs)) return { view: 'overview', key: 'o', jump: hs.length > 1 ? dec(hs.slice(1)) : null };
    var p = hs.slice(2).split('/').map(dec);
    if (p[0] === 's' && p[1]) {
      if (p[2] === 't' && p[3]) {
        var tk = p[3].replace(/~/g, '/');
        return { view: 'task', s: p[1], t: tk, key: 't:' + p[1] + ':' + tk };
      }
      if (p[2] === 'other') return { view: 'other', s: p[1], key: 'x:' + p[1] };
      return { view: 'session', s: p[1], key: 's:' + p[1] };
    }
    return { view: 'overview', key: 'o' };
  }
  function hrefSession(sh) { return '#/s/' + encodeURIComponent(str(sh)); }
  function hrefTask(sh, key) { return hrefSession(sh) + '/t/' + encodeURIComponent(str(key).replace(/\//g, '~')); }
  function hrefOther(sh) { return hrefSession(sh) + '/other'; }
  ui.route = parseRoute();

  // ---------- small utilities ----------
  function lsGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function saveFilters() {   // per-task filters (keys with ':') stay in memory only
    var o = {};
    Object.keys(ui.filters).forEach(function (k) { if (k.indexOf(':') < 0) o[k] = ui.filters[k]; });
    lsSet('cd:filters', o);
  }

  // h(tag, props, ...children): all text goes through text nodes / setAttribute, never innerHTML.
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v == null || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = String(v);
        else el.setAttribute(k, v === true ? '' : String(v));
      });
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false || c === '') return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    el.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  function str(x) { return x == null ? '' : String(x); }
  function stKey(s) { return KNOWN.indexOf(s) >= 0 ? s : 'neutral'; }
  function chip(s) { return h('span', { class: 'cd-chip', 'data-st': stKey(s) }, s ? String(s) : '—'); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function parseTs(iso) { var t = Date.parse(iso); return isNaN(t) ? null : t; }
  function fmtTime(iso) {
    var t = parseTs(iso); if (t == null) return str(iso);
    var d = new Date(t); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
  }
  function fmtDateTime(iso) {
    var t = parseTs(iso); if (t == null) return str(iso);
    var d = new Date(t);
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) + ' ' + fmtTime(iso) + ' UTC';
  }
  function fmtDur(s) {
    s = Math.max(0, Math.round(Number(s) || 0));
    if (s < 60) return s + 's';
    if (s < 3600) return Math.floor(s / 60) + 'm ' + pad(s % 60) + 's';
    return Math.floor(s / 3600) + 'h ' + pad(Math.floor(s / 60) % 60) + 'm';
  }
  function fmtAgo(iso) {
    var t = parseTs(iso); if (t == null) return '';
    var s = Math.round((Date.now() - t) / 1000);
    if (s < 5) return 'just now';
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }
  function fmtShort(iso) {   // "10-06 13:40" (UTC)
    var t = parseTs(iso); if (t == null) return str(iso);
    var d = new Date(t);
    return pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) + ' ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
  }
  function fmtEnd(start, end) {   // end time, without the date when it is the same day
    var fe = fmtShort(end), fs = fmtShort(start);
    return fe.slice(0, 5) === fs.slice(0, 5) ? fe.slice(6) : fe;
  }
  function shortType(t) { t = str(t); return t ? t.split(':').pop() : 'agent'; }
  function shortId(id) { id = str(id); return id === 'main' ? 'main' : id.slice(0, 7); }
  function shortModel(m) { return str(m).replace(/^claude-/, '').replace(/-\d{8}$/, ''); }
  function keyLabel(k) { return str(k).split('/').join(' / '); }
  function isAlive(a) { return (a.state === 'running' || a.state === 'blocked') && !a.ended; }
  function liveMode() { return canPoll() && ui.conn === 'ok' && S && S.live !== false; }
  function norm(parts) { return parts.map(str).join(' ').toLowerCase(); }
  function sShort(s) { return str(s && (s.short || str(s.id).slice(0, 6))); }

        outRows.length ? listWrap(h('ul', { class: 'cd-outs' }, outRows)) : h('p', { class: 'cd-empty' }, 'No agent outputs yet.'))));
  }

  function notFound(what) {
    return [section('missing', 'Not found', null, [
      h('p', null, what + ' is not in this status file. It may be older than the sessions kept, or not started yet.'),
      h('p', null, h('a', { href: '#/' }, '← Project overview'))])];
  }

  // A view: header text + sections for the current route.
  function buildView(D) {
    var r = ui.route, prog = str(S.program) || 'Conductor';
    var ov = { href: '#/', text: prog };
    if (r.view === 'overview') {
      return {
        title: prog, sub: str(S.subtitle), taskText: str(S.orchestrator_task), crumbs: null,
        placeholder: 'Search tasks, agents, decisions, log…',
        secs: [secCurrent(D), secFindings(D), secCompare(), secResults(), secOrchestrator(D), secHistory(D),
          secAgents(D, { withRoot: true, project: true }), secHitl(D), secLog(D)]
      };
    }
    var s = D.sessBy[r.s];
    if (!s) return { title: 'Session ' + r.s, crumbs: [ov, { text: 'Session ' + r.s }], placeholder: 'Search…', secs: notFound('Session ' + r.s) };
    var sh = sShort(s);
    var sCrumb = { href: hrefSession(sh), text: 'Session ' + sh };
    var sSub = [s.run ? s.run : 'no run id', fmtShort(s.started) + (s.live ? ' · live' : s.ended ? ' → ' + fmtEnd(s.started, s.ended) : '')].join(' · ');
    if (r.view === 'session') {
      return {
        title: sessTitle(s), sub: sSub, crumbs: [ov, { text: 'Session ' + sh }], placeholder: 'Search this session…',
        secs: [secSessionInfo(D, s), secSessionTasks(D, s)].concat(otherSecs(D, s))
      };
    }
    if (r.view === 'other') {
      return {
        title: 'Other activity', sub: 'Session ' + sh + ' · ' + sSub + ' · work that belongs to no task',
        crumbs: [ov, sCrumb, { text: 'Other activity' }], placeholder: 'Search other activity…', secs: otherSecs(D, s)
      };
    }
    var t = findTask(s, r.t);
    if (!t) return { title: keyLabel(r.t), crumbs: [ov, sCrumb, { text: keyLabel(r.t) }], placeholder: 'Search…', secs: notFound('Task ' + r.t + ' in session ' + sh) };
    var agents = arr(t.agents).map(function (id) { return D.byId[id]; }).filter(Boolean);
    return {
      title: keyLabel(t.key) + ' · ' + str(t.title || t.description),
      sub: 'Session ' + sh + ' · plan ' + str(t.plan),
      crumbs: [ov, sCrumb, { text: keyLabel(t.key) }], placeholder: 'Search agents, claims, gates, log…',
      secs: [
        secTaskHead(D, s, t),
        secAgents(D, { id: 'agents', title: 'Agents', sec: 'tagents', list: agents, empty: 'No agents bound to this task yet.' }),
        section('claims', 'Claims', filterBar('tclaims', arr(t.claims).map(function (c) { return c.state; }), 'claims'),
          arr(t.claims).length ? listWrap(h('ul', { class: 'cd-findings' }, claimRows(D, arr(t.claims), 'tclaims', false)))
            : h('p', { class: 'cd-empty' }, 'No claims reported yet.')),
        secTaskGates(D, s, t, agents),
        secTaskHitl(D, s, t),
        secTimeline(D, t.log, { id: 'log', title: 'Log', sec: 'tlog:' + sh + ':' + t.key, by: 'agent', empty: 'No events for this task yet.' }),
        secTaskFiles(D, t, agents)
      ]
    };
  }

  // ---------- render ----------
  var TOC_LABELS = { current: 'Current state', findings: 'Claims', compare: 'Comparison', results: 'Results',
    orchestrator: 'Orchestrator', history: 'Plans & sessions', agents: 'Agents', hitl: 'Human-in-the-loop', log: 'Log' };

  function renderHeader(V) {
    var prog = str(S.program) || 'Conductor';
    document.title = (V.crumbs ? V.title + ' · ' + prog : prog) + ' · Conductor';
    var cr = $('cd-crumbs');
    cr.textContent = '';
    if (V.crumbs) {
      V.crumbs.forEach(function (c, i) {
        if (i) cr.appendChild(h('span', { 'aria-hidden': 'true' }, '›'));
        cr.appendChild(c.href ? h('a', { href: c.href }, c.text) : h('span', { 'aria-current': 'page' }, c.text));
      });
    }
    cr.hidden = !V.crumbs;
    $('cd-h1').textContent = V.title;
    $('cd-sub').textContent = str(V.sub);
    $('cd-sub').hidden = !V.sub;
    $('cd-task-text').textContent = str(V.taskText);
    $('cd-task').hidden = !V.taskText;
    qEl.placeholder = V.placeholder || 'Search…';
    var f = $('cd-foot');
    f.textContent = '';
    add(f, [str(S.footer) || ('Updated ' + fmtDateTime(S.updated)), ' · Conductor dashboard']);
  }

  function navLink(href, current, props) {
    var o = { href: href, 'data-cd-fkey': 'nav:' + href };
    if (current) o['aria-current'] = 'page';
    Object.keys(props || {}).forEach(function (k) { o[k] = props[k]; });
    return o;
  }

  function renderNav(D) {
    var inner = $('cd-nav-inner'), body = $('cd-nav-body');
    var keep = inner.scrollTop;
    var r = ui.route;
    body.textContent = '';
    var oh = D ? D.sum.open_human : 0;
    body.appendChild(h('a', navLink('#/', r.view === 'overview', { class: 'cd-nav-ov' }),
      h('span', null, 'Project overview'), oh > 0 ? h('span', { class: 'cd-badge', 'aria-label': oh + ' open for you' }, oh) : null));
    if (r.view === 'overview' && ui.secIds && ui.secIds.length) {
      body.appendChild(h('ul', { class: 'cd-nav-jumps', 'aria-label': 'On this page' }, ui.secIds.map(function (id) {
        var badge = id === 'hitl' && oh > 0 ? h('span', { class: 'cd-badge', 'aria-label': oh + ' open' }, oh) : null;
        return h('li', null, h('a', { href: '#' + id, 'data-cd-fkey': 'jump:' + id }, h('span', null, TOC_LABELS[id] || id), badge));
      })));
    }
    var sessions = D ? D.sessions : [];
    body.appendChild(h('p', { class: 'cd-nav-title' }, 'Sessions', sessions.length ? h('span', null, '(' + sessions.length + ')') : null));
    if (!sessions.length) body.appendChild(h('p', { class: 'cd-empty cd-small' }, D ? 'No sessions recorded yet.' : '—'));
    var curLabel = 'Project overview';
    var ul = h('ul', null, sessions.map(function (s, idx) {
      var sh = sShort(s), here = r.s === sh || (D.sessBy[r.s] === s);
      var exp = sh in ui.nav ? ui.nav[sh] : (here || s.live || (idx === 0 && !r.s));
      if (here) curLabel = 'Session ' + sh;
      var tasks = arr(s.tasks).map(function (t) {
        var cur = here && r.view === 'task' && r.t === t.key;
        if (cur) curLabel = keyLabel(t.key);
        return h('li', null, h('a', navLink(hrefTask(sh, t.key), cur, { title: str(t.plan) + ' / ' + str(t.id) + ' · ' + str(t.title) }),
          h('span', { class: 'cd-nav-key' }, keyLabel(t.key)), h('span', { class: 'cd-nav-ttl' }, str(t.title || t.description)), chip(t.state)));
      });
      var o = s.other || {};
      if (arr(o.agents).length || arr(o.log).length) {
        var curO = here && r.view === 'other';
        if (curO) curLabel = 'Session ' + sh + ' · other';
        var n = arr(o.agents).length + arr(o.log).length;
        tasks.push(h('li', { class: 'cd-nav-other' }, h('a', navLink(hrefOther(sh), curO, null),
          h('span', { class: 'cd-nav-key', 'aria-hidden': 'true' }, '…'), h('span', { class: 'cd-nav-ttl' }, 'Other activity'),
          h('span', { class: 'cd-nav-key' }, String(n)))));
      }
      return h('li', { class: 'cd-sess' },
        h('div', { class: 'cd-sess-row' },
          h('button', { type: 'button', class: 'cd-tog', 'aria-expanded': exp ? 'true' : 'false', 'aria-controls': 'cd-nt-' + sh,
            'data-cd-navtog': sh, 'data-cd-fkey': 'nt:' + sh, 'aria-label': (exp ? 'Hide' : 'Show') + ' tasks of session ' + sh },
            h('span', { class: 'cd-caret', 'aria-hidden': 'true' }, '▶')),
          h('a', navLink(hrefSession(sh), here && r.view === 'session', { class: 'cd-sess-link' }),
            h('span', { class: 'cd-sess-time' }, sessWhen(s)),
            h('span', { class: 'cd-sess-title' }, sessTitle(s)),
            h('span', { class: 'cd-sess-counts' }, sessCounts(s, D)))),
        h('ul', { class: 'cd-nav-tasks', id: 'cd-nt-' + sh, hidden: !exp }, tasks.length ? tasks : h('li', { class: 'cd-empty cd-small' }, 'No tasks.')));
    }));
    body.appendChild(ul);
    inner.scrollTop = keep;
    $('cd-drawer-cur').textContent = '· ' + curLabel;
    $('cd-drawer').setAttribute('aria-expanded', ui.drawer ? 'true' : 'false');
    if (ui.drawer) $('cd-nav').setAttribute('data-open', ''); else $('cd-nav').removeAttribute('data-open');
  }

  function render(opts) {
    opts = opts || {};
    var body = $('cd-body');
    var y = window.scrollY, anchor = opts.nav ? null : findAnchor();
    var ae = document.activeElement;
    var fkey = ae && ae.getAttribute ? ae.getAttribute('data-cd-fkey') : null;

    if (!S || typeof S !== 'object') {
      body.textContent = '';
      body.appendChild(h('p', { class: 'cd-nodata' }, canPoll() ? 'Waiting for status.json…' : 'No status data embedded in this page.'));
      ui.secIds = null;
      renderNav(null);
      updateLive();
      return;
    }
    var D = derive(S);
    var V = buildView(D);
    renderHeader(V);
    var secs = V.secs.filter(Boolean);
    body.textContent = '';
    secs.forEach(function (s) { body.appendChild(s); });
    ui.secIds = ui.route.view === 'overview' ? secs.map(function (s) { return s.id; }) : null;
    renderNav(D);

    Array.prototype.forEach.call(body.querySelectorAll('details[data-key]'), function (d) {
      if (ui.open[d.getAttribute('data-key')]) d.open = true;
    });
    ui.renderedAt = Date.now();
    applyFilters();
    showPhase(null);
    updateLive();
    tick();
    if (opts.nav) {
      var jt = ui.route.jump && document.getElementById(ui.route.jump);
      if (jt) jt.scrollIntoView({ behavior: 'instant', block: 'start' });
      else window.scrollTo({ top: opts.y || 0, left: 0, behavior: 'instant' });
    } else restoreScroll(anchor, y);
    if (fkey) {
      var all = document.querySelectorAll('[data-cd-fkey]');
      for (var i = 0; i < all.length; i++) if (all[i].getAttribute('data-cd-fkey') === fkey) { all[i].focus({ preventScroll: true }); break; }
    }
  }

  // Keep the viewer's place: pin the first visible keyed element to the same viewport offset.
  function findAnchor() {
    var els = document.querySelectorAll('[data-cd-anchor]');
    var best = null;
    for (var i = 0; i < els.length; i++) {
      var r = els[i].getBoundingClientRect();
      if (r.height === 0) continue;
      if (r.bottom > 0) { best = { key: els[i].getAttribute('data-cd-anchor'), top: r.top }; if (r.top >= 0) break; }
    }
    return best;
  }
  function restoreScroll(anchor, y) {
    var target = y;
    if (anchor) {
      var els = document.querySelectorAll('[data-cd-anchor]');
      for (var i = 0; i < els.length; i++) {
        if (els[i].getAttribute('data-cd-anchor') === anchor.key && els[i].getBoundingClientRect().height > 0) {
          target = window.scrollY + els[i].getBoundingClientRect().top - anchor.top;
          break;
        }
      }
    }
    window.scrollTo({ top: target, left: 0, behavior: 'instant' });
  }

  function setAuto(d, want) {
    if (want && !d.open) { d.open = true; d.setAttribute('data-cd-auto', ''); }
    else if (!want && d.hasAttribute('data-cd-auto')) { d.open = false; d.removeAttribute('data-cd-auto'); }
  }

  function applyFilters() {
    var terms = ui.q.toLowerCase().split(/\s+/).filter(Boolean);
    var match = function (s) { s = s || ''; return terms.every(function (t) { return s.indexOf(t) >= 0; }); };
    var rows = document.querySelectorAll('[data-cd-row]');
    var shown = 0;
    Array.prototype.forEach.call(rows, function (r) {
      var f = ui.filters[r.getAttribute('data-cd-row')] || 'all';
      var vis = (f === 'all' || r.getAttribute('data-cd-state') === f) && match(r.getAttribute('data-cd-q'));
      r.hidden = !vis;
      if (vis) shown++;
      if (r.tagName === 'DETAILS' && r.hasAttribute('data-cd-qs')) {
        // open an agent row when the match is only inside its collapsed body
        setAuto(r, vis && terms.length > 0 && !match(r.getAttribute('data-cd-qs')));
      }
    });
    Array.prototype.forEach.call(document.querySelectorAll('details[data-cd-container]'), function (d) {
      var any = terms.length > 0 && d.querySelector('[data-cd-row]:not([hidden])');
      setAuto(d, !!any);
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-cd-list]'), function (l) {
      var all = l.querySelectorAll('[data-cd-row]');
      var vis = l.querySelectorAll('[data-cd-row]:not([hidden])');
      var nm = l.querySelector(':scope > .cd-nomatch');
      if (nm) nm.hidden = !(all.length > 0 && vis.length === 0);
      var tbl = l.querySelector(':scope > .cd-scroll');
      if (tbl) tbl.hidden = all.length > 0 && vis.length === 0;
    });
    $('cd-count').textContent = shown + ' of ' + rows.length + ' shown';
  }

  // phase line: hover/focus previews, click pins, default = running phase
  function defaultPhase() {
    var ps = arr(S && S.phases);
    var i = ps.findIndex(function (p) { return p.state === 'running'; });
    if (i < 0) i = ps.findIndex(function (p) { return p.state !== 'done'; });
    if (i < 0) i = ps.length - 1;
    return i;
  }
  function showPhase(i) {
    var el = $('cd-phase-detail');
    if (!el) return;
    var ps = arr(S.phases);
    if (i == null) i = ui.phaseSel != null && ui.phaseSel < ps.length ? ui.phaseSel : defaultPhase();
    var p = ps[i];
    el.textContent = '';
    if (!p) return;
    var tids = arr(p.tasks).length ? arr(p.tasks) : arr(S.tasks).filter(function (t) { return t.phase === p.id; }).map(function (t) { return t.id; });
    var done = arr(S.tasks).filter(function (t) { return tids.indexOf(t.id) >= 0 && t.state === 'done'; }).length;
    add(el, [h('strong', null, str(p.id)), h('span', null, str(p.name)), chip(p.state),
      tids.length ? h('span', { class: 'cd-muted' }, done + ' of ' + tids.length + ' tasks done') : null,
      p.note ? h('span', { class: 'cd-muted' }, '· ' + p.note) : null]);
  }

  function updateLive() {
    var mode = !canPoll() ? 'snapshot' : ui.conn !== 'ok' ? 'lost' : (S && S.live === false ? 'snapshot' : 'live');
    var el = $('cd-live');
    el.setAttribute('data-mode', mode);
    $('cd-live-text').textContent = mode === 'live' ? 'live' : mode === 'lost' ? 'connection lost — showing last state' : 'snapshot';
  }

  function tick() {
    if (S && S.updated) $('cd-updated').textContent = 'Updated ' + fmtDateTime(S.updated) + ' · ' + fmtAgo(S.updated);
    Array.prototype.forEach.call(document.querySelectorAll('[data-cd-ago]'), function (el) {
      var v = fmtAgo(el.getAttribute('data-cd-ago'));
      if (el.textContent !== v) el.textContent = v;
    });
    if (!liveMode()) return;
    var dt = (Date.now() - ui.renderedAt) / 1000;
    Array.prototype.forEach.call(document.querySelectorAll('[data-cd-tick]'), function (el) {
      el.textContent = fmtDur(Number(el.getAttribute('data-base')) + dt);
    });
  }

  // ---------- events ----------
  var qEl = $('cd-q');
  qEl.addEventListener('input', function () { ui.q = qEl.value; applyFilters(); });

  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var fb = t.closest('[data-cd-filter]');
    if (fb) {
      var sec = fb.getAttribute('data-cd-filter'), val = fb.getAttribute('data-cd-val');
      if (val === 'all') delete ui.filters[sec]; else ui.filters[sec] = val;
      saveFilters();
      Array.prototype.forEach.call(document.querySelectorAll('[data-cd-filter]'), function (b) {
        if (b.getAttribute('data-cd-filter') === sec) b.setAttribute('aria-pressed', b === fb ? 'true' : 'false');
      });
      applyFilters();
      return;
    }
    var nt = t.closest('[data-cd-navtog]');
    if (nt) {
      var sh = nt.getAttribute('data-cd-navtog'), exp = nt.getAttribute('aria-expanded') !== 'true';
      ui.nav[sh] = exp;
      nt.setAttribute('aria-expanded', exp ? 'true' : 'false');
      nt.setAttribute('aria-label', (exp ? 'Hide' : 'Show') + ' tasks of session ' + sh);
      var lst = document.getElementById('cd-nt-' + sh);
      if (lst) lst.hidden = !exp;
      return;
    }
    if (t.closest('#cd-drawer')) {
      ui.drawer = !ui.drawer;
      $('cd-drawer').setAttribute('aria-expanded', ui.drawer ? 'true' : 'false');
      if (ui.drawer) $('cd-nav').setAttribute('data-open', ''); else $('cd-nav').removeAttribute('data-open');
      return;
    }
    var cb = t.closest('[data-cd-copy]');
    if (cb) { copyText(cb.getAttribute('data-cd-copy'), cb); return; }
    var seg = t.closest('[data-cd-phase]');
    if (seg) {
      var i = Number(seg.getAttribute('data-cd-phase'));
      ui.phaseSel = ui.phaseSel === i ? null : i;
      Array.prototype.forEach.call(document.querySelectorAll('[data-cd-phase]'), function (b) {
        b.setAttribute('aria-pressed', Number(b.getAttribute('data-cd-phase')) === ui.phaseSel ? 'true' : 'false');
      });
      showPhase(null);
      return;
    }
    var sm = t.closest('summary');
    if (sm && sm.parentElement && sm.parentElement.hasAttribute('data-key')) {
      var d = sm.parentElement;
      setTimeout(function () {
        var k = d.getAttribute('data-key');
        if (d.open) ui.open[k] = 1; else delete ui.open[k];
        d.removeAttribute('data-cd-auto');
      }, 0);
    }
  });
  document.addEventListener('mouseover', function (ev) {
    var seg = ev.target && ev.target.closest && ev.target.closest('[data-cd-phase]');
    if (seg) showPhase(Number(seg.getAttribute('data-cd-phase')));
  });
  document.addEventListener('mouseout', function (ev) {
    var seg = ev.target && ev.target.closest && ev.target.closest('[data-cd-phase]');
    if (seg && !(ev.relatedTarget && seg.contains(ev.relatedTarget))) showPhase(null);
  });
  document.addEventListener('focusin', function (ev) {
    var seg = ev.target && ev.target.closest && ev.target.closest('[data-cd-phase]');
    if (seg) showPhase(Number(seg.getAttribute('data-cd-phase')));
  });
  document.addEventListener('focusout', function (ev) {
    var seg = ev.target && ev.target.closest && ev.target.closest('[data-cd-phase]');
    if (seg) showPhase(null);
  });

  var copyMsg = h('span', { class: 'cd-vh', role: 'status', 'aria-live': 'polite' });
  document.body.appendChild(copyMsg);
  function copyText(text, btn) {
    var ok = function () {
      if (!btn.hasAttribute('data-cd-label')) btn.setAttribute('data-cd-label', btn.textContent);
      btn.textContent = 'Copied ✓';
      copyMsg.textContent = 'Copied to clipboard';
      clearTimeout(btn._cdT);
      btn._cdT = setTimeout(function () { btn.textContent = btn.getAttribute('data-cd-label') || 'Copy'; copyMsg.textContent = ''; }, 1500);
    };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var done = false;
      try { done = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      btn.focus({ preventScroll: true });
      if (done) ok(); else window.prompt('Copy this reply:', text);
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fallback);
    else fallback();
  }

  // theme toggle
  var themeBtn = $('cd-theme');
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function effTheme() {
    var a = document.documentElement.getAttribute('data-theme');
    return a === 'dark' || a === 'light' ? a : (mq && mq.matches ? 'dark' : 'light');
  }
  function syncThemeBtn() {
    var next = effTheme() === 'dark' ? 'light' : 'dark';
    themeBtn.textContent = next === 'dark' ? '◐ Dark' : '◑ Light';
    themeBtn.setAttribute('aria-label', 'Switch to ' + next + ' theme');
  }
  themeBtn.addEventListener('click', function () {
    var next = effTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('cd:theme', next); } catch (e) {}
    syncThemeBtn();
  });
  if (mq && mq.addEventListener) mq.addEventListener('change', syncThemeBtn);
  syncThemeBtn();

  // ---------- routing ----------
  window.addEventListener('hashchange', function () {
    var prev = ui.route, next = parseRoute();
    if (next.key === prev.key) {   // in-page jump (#hitl) within the overview: the browser scrolls natively
      ui.route = next;
      if (ui.drawer) { ui.drawer = false; renderNav(derive(S || {})); }
      return;
    }
    ui.qBy[prev.key] = ui.q;
    ui.scrollBy[prev.key] = window.scrollY;
    ui.route = next;
    ui.q = ui.qBy[next.key] || '';
    qEl.value = ui.q;
    var hadDrawer = ui.drawer;
    ui.drawer = false;
    render({ nav: true, y: ui.scrollBy[next.key] || 0 });
    if (hadDrawer) $('cd-h1').focus({ preventScroll: true });
  });

  // ---------- live polling ----------
  // Only when served over http(s) and not in artifact mode; the check runs again before every request.
  function poll() {
    if (!canPoll()) return;
    fetch('./status.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        var wasLost = ui.conn !== 'ok';
        ui.conn = 'ok';
        if (j && (!S || j.updated !== S.updated)) { S = j; render(); }
        else if (wasLost) updateLive();
      })
      .catch(function () { if (ui.conn !== 'lost') { ui.conn = 'lost'; updateLive(); } })
      .then(function () { if (canPoll()) setTimeout(poll, POLL_MS); });
  }

  render({ nav: true, y: 0 });   // first paint: honour an in-page #section hash
  setInterval(tick, 1000);
  if (canPoll()) poll();
  window.cdRender = function (next) { if (next) S = next; render(); };   // debugging hook
})();
</script>
